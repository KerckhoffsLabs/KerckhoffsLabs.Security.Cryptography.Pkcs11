name: OpenSSL 3.5
description: >
  Builds an OpenSSL 3.5 release into ~/openssl-3.5 (cached per runner architecture) and points the rest of
  the job at it through OPENSSL_PREFIX and LD_LIBRARY_PATH. Linux only.

# Native backends are built against OpenSSL 3.5+ so ML-DSA (CKM_ML_DSA) compiles into SoftHSM, and
# Kryoptic's "pqc" feature and opencryptoki's ML-DSA/ML-KEM work; ubuntu-latest ships 3.0. 3.5 is the
# LTS line upstream SoftHSM CI tests against; this tracks its latest patch release. It goes into a
# user-writable prefix: cache-friendly, no sudo.
#
# OPENSSL_PREFIX: build-softhsmv2.sh, build-kryoptic.sh and build-opencryptoki.sh link against it.
# LD_LIBRARY_PATH: at runtime the .NET host loads the system libcrypto.so.3 (OpenSSL 3.0) first, so
# the rpath baked into those modules loses to the already-loaded soname and the OPENSSL_3.4.0+
# symbols ML-DSA needs are missing. Putting the 3.5 libdir on the loader path makes the whole
# process use OpenSSL 3.5, which .NET also supports.

# The release and the SHA-256 OpenSSL publishes for its tarball. A bump changes the cache key, so
# the next run rebuilds.
inputs:
  version:
    description: OpenSSL 3.5 patch release to build.
    default: '3.5.9'
  sha256:
    description: SHA-256 of openssl-<version>.tar.gz, as published with the release.
    default: '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a'

runs:
  using: composite
  steps:
    - name: Cache OpenSSL 3.5
      id: cache
      uses: actions/cache@v6.1.0
      with:
        path: ~/openssl-3.5
        key: openssl-${{ inputs.version }}-${{ runner.arch }}

    - name: Build OpenSSL ${{ inputs.version }} (on cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        work="$(mktemp -d)"; cd "$work"
        curl -fsSL --proto '=https' --proto-redir '=https' -O "https://github.com/openssl/openssl/releases/download/openssl-${VERSION}/openssl-${VERSION}.tar.gz"
        echo "${SHA256}  openssl-${VERSION}.tar.gz" | sha256sum -c -
        tar -xf "openssl-${VERSION}.tar.gz" && cd "openssl-${VERSION}"
        ./config shared zlib no-ssl3 no-weak-ssl-ciphers --prefix="$HOME/openssl-3.5" --openssldir="$HOME/openssl-3.5"
        make -j"$(nproc)" >/dev/null
        make install_sw >/dev/null
        ( cd "$HOME/openssl-3.5" && ln -sf lib64 lib ) || true

    - name: Point the job at OpenSSL 3.5
      shell: bash
      run: |
        echo "OPENSSL_PREFIX=$HOME/openssl-3.5" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib64:$HOME/openssl-3.5/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
