name: Docs

# Build the DocFX site and publish it to GitHub Pages.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'dotnet-tools.json'
      - 'global.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least-privilege token; Pages deployment needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools (docfx)
        run: dotnet tool restore

      # docfx's metadata step compiles the library via Roslyn; build it first (Release) so the
      # source generator runs and the generated *_Windows interop types resolve (otherwise docfx
      # reports FailedToResolveAnalyzer + CS0246 and produces no API metadata).
      - name: Build library (runs the source generator for docfx)
        run: dotnet build src/KerckhoffsLabs.Security.Cryptography.Pkcs11/KerckhoffsLabs.Security.Cryptography.Pkcs11.csproj -c Release

      - name: Build documentation (metadata + site)
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Create the Pages site (build type = GitHub Actions) if it isn't set up yet,
          # so no manual Settings -> Pages toggle is required.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
