name: Docs

# Build the DocFX site and publish it to GitHub Pages.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'dotnet-tools.json'
      - 'global.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Permissions are declared per job (least privilege): the build job only reads, the deploy job
# holds the pages:write + id-token:write the deployment needs. None at workflow level, so a job
# added later starts with no token permissions until it asks.
permissions: {}

# Serialize Pages deployments; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # checkout
      pages: read      # configure-pages reads the site config
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools (docfx)
        run: dotnet tool restore

      # docfx's metadata step compiles the library via Roslyn; build it first (Release) so the
      # source generator runs and the generated *_Windows interop types resolve (otherwise docfx
      # reports FailedToResolveAnalyzer + CS0246 and produces no API metadata).
      - name: Build library (runs the source generator for docfx)
        run: dotnet build src/KerckhoffsLabs.Security.Cryptography.Pkcs11/KerckhoffsLabs.Security.Cryptography.Pkcs11.csproj -c Release

      - name: Build documentation (metadata + site)
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      # Pages must already be enabled with "GitHub Actions" as the source
      # (Settings -> Pages); the workflow token cannot create the site itself.
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # deploy-pages publishes the artifact
      id-token: write  # deploy-pages authenticates to the Pages API via OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
