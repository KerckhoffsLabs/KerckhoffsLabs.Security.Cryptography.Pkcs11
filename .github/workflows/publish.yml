name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing
      attestations: write  # required for attest-build-provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required to resolve the tag ref
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Derive the version from the tag once so the build stamps it into the
      # assembly (AssemblyVersion/FileVersion/InformationalVersion), not just the
      # package. The --no-build pack below then reuses the versioned assemblies.
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet restore src/KerckhoffsLabs.sln

      - run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release /p:Version=$VERSION

      - run: dotnet test src/KerckhoffsLabs.sln --no-build -c Release

      - name: Pack
        run: dotnet pack src/KerckhoffsLabs.Security.Cryptography.Pkcs11/KerckhoffsLabs.Security.Cryptography.Pkcs11.csproj --no-build -c Release -o ./artifacts /p:Version=$VERSION

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ./artifacts/*.nupkg

      - name: NuGet login (OIDC)
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .nupkg; the adjacent .snupkg symbol package (IncludeSymbols +
      # SymbolPackageFormat=snupkg in the csproj) is pushed automatically too —
      # `dotnet nuget push` ships symbols unless --no-symbols is given. Do not add a
      # separate *.snupkg push: that would be a duplicate and fail with 409 Conflict.
      - run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
