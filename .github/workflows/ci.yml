name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref on pull requests (a new push obsoletes the
# in-flight matrix); always let every push to main run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Lint builds managed code only, so this job needs neither the submodules nor a C toolchain.
      SkipNativeBuilds: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402' # exact SDK: the lock files record its ILLink and ILCompiler packages (see the library's .csproj)

      - run: dotnet restore KerckhoffsLabs.sln --locked-mode

      # `dotnet format` loads source generators from the built analyzer assemblies, so the
      # solution must be built first — otherwise the generated `CK_*_Windows` types are absent
      # and format aborts with CS0246 before it can check formatting. The native vendor builds
      # are skipped (env above), so this compiles managed code only.
      - run: dotnet build KerckhoffsLabs.sln --no-restore

      - run: dotnet format KerckhoffsLabs.sln --verify-no-changes --no-restore

  build-and-test:
    name: ${{ matrix.os }}${{ matrix.arch == 'x86' && ' (x86)' || '' }}
    runs-on: ${{ matrix.os }}
    # Generous ceiling: a cold cache builds OpenSSL 3.5 + SoftHSM (+ opencryptoki on ubuntu-latest)
    # from source, but a hung native build should not run for GitHub's 6-hour default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-latest
          # osx-x64 is a shipped RID; Apple Silicon runners cannot execute it natively.
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
          - os: windows-latest
            arch: x86
          - os: windows-11-arm
            arch: arm64

    steps:
      # submodules: the test project builds pkcs11-mock (vendor/pkcs11-mock) and,
      # on Linux (x64+arm64), macOS, and Windows (x64+x86+arm64), SoftHSM2 (vendor/softhsmv2)
      # from source during `dotnet build`. The ubuntu-latest leg additionally builds opencryptoki
      # (vendor/opencryptoki) and Kryoptic (vendor/kryoptic) from source as additional independent
      # real backends — recursive pulls all of them.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402' # exact SDK: the lock files record its ILLink and ILCompiler packages (see the library's .csproj)
          # macOS runners are Apple Silicon: use the native arm64 SDK. Forcing x64 there runs
          # dotnet under Rosetta, so the pkcs11-mock build script's `uname -m` reports x86_64
          # (places the lib under osx-x64) while the testhost resolves osx-arm64 — a mismatch that
          # makes every Mock-backend test fail to find pkcs11-mock.dylib.
          architecture: ${{ matrix.arch || (runner.os == 'macOS' && 'arm64' || 'x64') }}

      # pkcs11-mock builds with gcc/make (in build-essential) on Linux/macOS and MSVC on Windows.
      # SoftHSM2 builds from source during the Build step below (BeforeTargets), placing the
      # libraries next to the test assembly where the backend fixtures auto-discover them:
      #   - Linux:        autotools (autoconf/automake/libtool) against an OpenSSL 3.5 we build below.
      #   - macOS:        autotools against Homebrew OpenSSL 3 (native arm64).
      #   - Windows x64/x86/arm64: CMake + vcpkg OpenSSL (build-softhsmv2.ps1), each for its own triplet
      #     so the library matches the testhost arch. vcpkg OpenSSL is cached per-arch below.
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev autoconf automake libtool

      # OpenSSL 3.5 for SoftHSM's ML-DSA, and for opencryptoki and Kryoptic on the ubuntu-latest leg;
      # see the action for why the whole process, not just the modules, must load it.
      - name: OpenSSL 3.5 (Linux)
        if: runner.os == 'Linux'
        uses: $/.github/actions/openssl35

      # macOS: SoftHSM builds with autotools against Homebrew OpenSSL 3. Unlike Linux, .NET on macOS
      # uses Apple's crypto (not system OpenSSL), so there is no in-process libcrypto collision — no
      # DYLD path needed. libsofthsm2.dylib records its libcrypto dependency by Homebrew's absolute
      # install path, which persists on the runner, so the copied-out dylib resolves it at runtime.
      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install autoconf automake libtool openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # build-softhsmv2.ps1 runs `vcpkg install openssl:<triplet>` during the Build step — a
      # from-source OpenSSL build (~27 min cold). vcpkg's default binary cache makes a warm restore
      # near-instant. Split restore/save: actions/cache's single-step post-save is skipped when the
      # job fails (and these runs fail at Test while we iterate on SoftHSM), so the archive would
      # never persist. The dedicated save step runs with if: always() — it saves the OpenSSL build
      # right after Build regardless of the later Test outcome. vcpkg keys archives by ABI hash
      # internally, so a coarse cache key is safe (a mismatch just rebuilds).
      - name: Restore vcpkg OpenSSL cache (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-openssl-${{ matrix.arch || 'x64' }}-windows-v1

      # Cache the *built* native libraries (pkcs11-mock + SoftHSM2 + its OpenSSL runtime DLLs) so the
      # whole native build — vcpkg install, CMake/autotools compile, link — is skipped on a hit. Keyed
      # on both vendored submodule SHAs and the build scripts, so a submodule bump or script change
      # rebuilds. On a hit we set SkipPkcs11MockBuild/SkipSoftHsmV2Build so the BeforeTargets don't run
      # and the restored artifacts are used as-is (the vcpkg/OpenSSL caches stay as the miss fallback).
      # Also records the Kryoptic, NSS and Craton HSM revisions, which key their own caches on ubuntu-latest.
      - name: Submodule revisions
        id: rev
        shell: bash
        run: |
          echo "native=native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch || 'native' }}-mock_$(git -C vendor/pkcs11-mock rev-parse HEAD)-hsm_$(git -C vendor/softhsmv2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "kryoptic=$(git -C vendor/kryoptic rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "craton=$(git -C vendor/craton-hsm-core rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "nss=$(git -C vendor/nss rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "bouncyhsm=$(git -C vendor/bouncyhsm rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache built native libraries
        id: native-cache
        uses: actions/cache@v6.1.0
        with:
          path: tests/KerckhoffsLabs.Security.Cryptography.Pkcs11.Tests/bin/Release/net10.0/runtimes
          key: ${{ steps.rev.outputs.native }}-${{ hashFiles('build/build-softhsmv2.sh', 'build/build-softhsmv2.ps1', 'build/build-pkcs11-mock.sh', 'build/build-pkcs11-mock.ps1', 'build/lib/common.sh') }}-v1

      # Fourth independent real backend (ubuntu-latest only): Kryoptic, a Rust/OpenSSL PKCS#11 soft
      # token, built by the Build step below. Its "standard" feature set needs OpenSSL >= 3.2 (EdDSA)
      # and "pqc" (ML-KEM/ML-DSA/SLH-DSA) needs >= 3.5, so it links against the same OpenSSL 3.5 as
      # SoftHSM (ossl-sys locates it via pkg-config; PKG_CONFIG_PATH is set inside build-kryoptic.sh
      # from OPENSSL_PREFIX, which the OpenSSL 3.5 step exports for the whole job). AES-CCM and
      # SLH-DSA are the two mechanism families that had zero real-backend coverage even with
      # SoftHSM + opencryptoki + NSS (see KryopticBackendFixture).
      - name: Cache Kryoptic build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6.1.0
        with:
          path: vendor/kryoptic/target
          key: kryoptic-${{ runner.arch }}-${{ steps.rev.outputs.kryoptic }}-${{ hashFiles('build/build-kryoptic.sh') }}-v1

      # Craton HSM (ubuntu-latest only): a pure-Rust PKCS#11 soft HSM on the RustCrypto crates, built by
      # the Build step below with the runner's stable Rust; it needs no OpenSSL. The cargo target
      # directory is cached like Kryoptic's, so a hit only relinks.
      - name: Cache Craton HSM build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6.1.0
        with:
          path: vendor/craton-hsm-core/target
          key: craton-hsm-${{ runner.arch }}-${{ steps.rev.outputs.craton }}-${{ hashFiles('build/build-craton-hsm.sh') }}-v1

      # BouncyHsm (ubuntu-latest only, like the other extra backends): the published server plus the
      # native client. A hit skips the BuildBouncyHsm target, including its ~3 min cold publish.
      - name: Cache BouncyHsm build
        if: matrix.os == 'ubuntu-latest'
        id: bouncyhsm-cache
        uses: actions/cache@v6.1.0
        with:
          path: tests/KerckhoffsLabs.Security.Cryptography.Pkcs11.Tests/bin/Release/net10.0/bouncyhsm
          key: bouncyhsm-${{ runner.os }}-${{ runner.arch }}-${{ steps.rev.outputs.bouncyhsm }}-${{ hashFiles('build/build-bouncyhsm.sh', 'build/lib/common.sh') }}-v1

      - name: Restore
        run: dotnet restore KerckhoffsLabs.sln --locked-mode

      - name: Build
        env:
          # On a native-cache hit the prebuilt pkcs11-mock + SoftHSM2 are already in place; skip both
          # native build scripts so the BeforeTargets don't recompile from the vendored submodules.
          SkipPkcs11MockBuild: ${{ steps.native-cache.outputs.cache-hit == 'true' && 'true' || '' }}
          SkipSoftHsmV2Build: ${{ steps.native-cache.outputs.cache-hit == 'true' && 'true' || '' }}
          # Kryoptic's BeforeTarget places libkryoptic_pkcs11.so next to the test assembly, where
          # KryopticBackendFixture finds it, as code-quality.yml does.
          BuildKryoptic: ${{ matrix.os == 'ubuntu-latest' && 'true' || '' }}
          # Craton HSM's BeforeTarget places libcraton_hsm.so next to the test assembly, where
          # CratonHsmBackendFixture finds it.
          BuildCratonHsm: ${{ matrix.os == 'ubuntu-latest' && 'true' || '' }}
          # BouncyHsm's BeforeTarget stages its server and native client under bin/…/bouncyhsm, where
          # BouncyHsmBackendFixture finds them; on a cache hit they are already there.
          BuildBouncyHsm: ${{ matrix.os == 'ubuntu-latest' && steps.bouncyhsm-cache.outputs.cache-hit != 'true' && 'true' || '' }}
        run: dotnet build KerckhoffsLabs.sln --no-restore -c Release

      # Persist the vcpkg OpenSSL build right after it's produced, even if the Test step later fails
      # (if: always()). Only saves on a cache miss — an existing key can't be overwritten anyway. The
      # x64 and x86 legs build different OpenSSL triplets, so the cache key includes the arch.
      - name: Save vcpkg OpenSSL cache (Windows)
        if: always() && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-openssl-${{ matrix.arch || 'x64' }}-windows-v1

      # Second independent real backend, on the Linux x64 leg only: opencryptoki's software token,
      # built from source from the pinned vendor/opencryptoki submodule (master after v3.27.0) —
      # reproducible and independent of what ubuntu-latest ships. Running the same operations
      # against a module unrelated to SoftHSM catches a mis-encoding the wrapper and SoftHSM happen
      # to share. It is built against the OpenSSL 3.5 above, staged to /opt (outside /home) so the
      # daemon — which runs under the shipped unit's ProtectHome=yes — can load it via the baked
      # rpath; that compiles in the ML-DSA sign-message path (#ifdef EVP_PKEY_OP_SIGNMSG, OpenSSL
      # 3.5 only) so ML-DSA signing works.
      - name: Stage OpenSSL 3.5 outside /home (opencryptoki)
        if: matrix.os == 'ubuntu-latest'
        run: sudo cp -a "$HOME/openssl-3.5" /opt/openssl-3.5

      - name: Build opencryptoki from source
        if: matrix.os == 'ubuntu-latest'
        env:
          OPENSSL_PREFIX: /opt/openssl-3.5
        run: |
          set -euxo pipefail
          # autoconf/automake/libtool/build-essential/libssl-dev come from the Linux deps step above.
          sudo apt-get install -y flex bison libcap-dev libldap2-dev pkg-config
          # The pkcs11 group must exist before `make install` (it chgrp's the token store to it).
          sudo groupadd -f pkcs11
          ./build/build-opencryptoki.sh
          sudo ldconfig

      # One soft-token slot, the pkcsslotd daemon and an initialized token; the script prints the
      # library path. The token label and user PIN are the tests' defaults (see the script), so only
      # the library path is exported.
      - name: Provision opencryptoki software token
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          lib="$(./build/provision-opencryptoki.sh)"
          echo "PKCS11_TEST_OPENCRYPTOKI_LIBRARY=$lib" >> "$GITHUB_ENV"

      # Third independent real backend (ubuntu-latest only): Mozilla NSS softoken, built from the
      # pinned vendor/nss submodule. NSS is an unrelated crypto stack (freebl, not
      # OpenSSL) with a login-free generic token — no daemon or PIN — and it uniquely implements
      # ChaCha20-Poly1305 and the SP800-108 KDF, which neither SoftHSM nor opencryptoki does.
      - name: Cache NSS softoken
        if: matrix.os == 'ubuntu-latest'
        id: nss-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/nss
          key: nss-${{ steps.rev.outputs.nss }}-${{ hashFiles('build/build-nss.sh', 'build/lib/common.sh') }}-v1

      # build.sh drives gyp + ninja against the distro NSPR (--system-nspr); patchelf bakes an
      # $ORIGIN runpath so the module finds its NSS siblings. The heavy build toolchain is installed
      # only on a cache miss; the runtime NSPR (libnspr4) is ensured either way so the cached module
      # still loads.
      - name: Build NSS softoken
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euxo pipefail
          sudo apt-get install -y libnspr4
          NSSDIR="$RUNNER_TEMP/nss/runtimes/linux-x64/native/nss"
          if [ ! -f "$NSSDIR/libsoftokn3.so" ]; then
            sudo apt-get install -y ninja-build libnspr4-dev patchelf clang
            python3 -m pip install --user --require-hashes --only-binary :all: -r build/requirements-nss.txt
            PATH="$HOME/.local/bin:$PATH" bash build/build-nss.sh "$RUNNER_TEMP/nss"
          fi
          {
            echo "PKCS11_TEST_NSS_LIBRARY=$NSSDIR/libsoftokn3.so"
            echo "PKCS11_TEST_NSS_DIR=$NSSDIR"
          } >> "$GITHUB_ENV"

      # All legs (Linux x64+arm64, macOS, Windows x64+x86+arm64) build both backends (pkcs11-mock +
      # SoftHSM2), so the SoftHSM-gated [Fact(SkipUnless = ...)] tests run everywhere and the
      # SoftHsm_IsAvailable_OnCiBuildPlatforms guard fails the job if the build failed to place libsofthsm2.
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --solution KerckhoffsLabs.sln --no-build -c Release --output Detailed

      # ubuntu-latest also exercises the opencryptoki, Kryoptic, NSS, BouncyHsm and Craton HSM backends. Run under the
      # pkcs11 group so the test host can read the opencryptoki token store. LD_LIBRARY_PATH must be
      # re-set *inside* the sg command: sg is set-group-ID, so the loader runs it in secure-execution
      # mode and strips LD_LIBRARY_PATH from the environment it passes on — without it, libsofthsm2.so,
      # the opencryptoki soft-token STDLL, and libkryoptic_pkcs11.so (each built against OpenSSL 3.5)
      # resolve against the system OpenSSL 3.0 and fail to load. PKCS11_TEST_OPENCRYPTOKI_* and
      # PKCS11_TEST_NSS_* survive (not security-sensitive); Kryoptic needs no variable, its fixture
      # finds the library the Build step placed, as does Craton HSM's. All five backend-gated suites run alongside the mock
      # suite in a single pass.
      - name: Test (incl. opencryptoki + Kryoptic + NSS + BouncyHsm + Craton HSM)
        if: matrix.os == 'ubuntu-latest'
        env:
          # Declares that THIS leg must have a working opencryptoki / Kryoptic / NSS: the
          # availability guard tests fail the job when a backend is missing, instead of letting
          # every backend-gated [Fact(SkipUnless = ...)] skip silently while CI stays green. Set on
          # the test step (not by the provisioning scripts) so a regression that stops exporting a
          # backend library is caught rather than masked.
          PKCS11_TEST_EXPECT_OPENCRYPTOKI: '1'
          PKCS11_TEST_EXPECT_KRYOPTIC: '1'
          PKCS11_TEST_EXPECT_NSS: '1'
          PKCS11_TEST_EXPECT_BOUNCYHSM: '1'
          PKCS11_TEST_EXPECT_CRATON_HSM: '1'
        # NSS's libsoftokn3 carries an $ORIGIN runpath for its own siblings; its dir is also added to
        # LD_LIBRARY_PATH (belt-and-suspenders under sg's stripped environment). PKCS11_TEST_NSS_* come
        # from $GITHUB_ENV, set by the NSS step above.
        run: sg pkcs11 -c "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib64:$PKCS11_TEST_NSS_DIR dotnet test --solution KerckhoffsLabs.sln --no-build -c Release --output Detailed"

  # Native-AOT smoke test: publishes tests/AotSmoke — a standalone app that references only the
  # main library (not the test project) — with PublishAot, then runs the native binary. A publish
  # failure catches trim/reflection/AOT-incompat regressions in the wrapper before consumers hit them;
  # the runs prove the interop layer actually works once AOT-compiled.
  #
  # Three runs per leg where the platform allows:
  #   - dynamic, against pkcs11-mock: C_GetInfo through a dlopen/LoadLibrary-loaded module.
  #   - session, against a SoftHSM token: login, key generation and search (attribute templates),
  #     the multi-pass attribute read, an RSA-PSS signature (a mechanism parameter struct), a digest,
  #     and the message API if bound. pkcs11-mock cannot answer the attribute reads this needs, so
  #     it uses the distribution's SoftHSM package (no from-source build here).
  #   - static, against pkcs11-mock linked into the executable: LoadStaticallyLinked, which
  #     resolves the bootstrap through the executable's own symbol table. It has no unit-testable
  #     equivalent and is what would have caught the bootstrap depending on Mono's "__Internal".
  #
  # The static half is per-platform: forcing an archive member in is a different flag on GNU ld and
  # ld64, and the symbol is exported by editing the version script ILC hands the linker on Linux
  # versus the exported-symbols list on Apple. Windows runs publish + dynamic only: its ExportsFile
  # is a .def, which the AotSmoke project does not implement, and there is no SoftHSM package to
  # install. That still compiles and runs the Windows-only Pack=1 struct path under AOT.
  aot-smoke:
    name: AOT smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            mock: pkcs11-mock.so
          - os: macos-latest
            rid: osx-arm64
            mock: pkcs11-mock.dylib
          - os: windows-latest
            rid: win-x64
            mock: pkcs11-mock.dll
    defaults:
      run:
        shell: bash
    steps:
      # Only pkcs11-mock is needed here, so skip the (large) SoftHSM/opencryptoki submodules
      # that `submodules: recursive` would pull — init just the one module after checkout.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Init pkcs11-mock submodule
        run: git submodule update --init --depth 1 vendor/pkcs11-mock

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402' # exact SDK: the lock files record its ILLink and ILCompiler packages (see the library's .csproj)

      # Native AOT links with clang against zlib; build-essential also provides the gcc/make
      # that build-pkcs11-mock.sh uses to compile the mock module below. macOS runners already
      # ship the Xcode command line tools that cover both; Windows runners ship MSVC.
      - name: Install AOT + native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev build-essential softhsm2

      - name: Install SoftHSM (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install softhsm

      # Build the mock so the published binary has a real PKCS#11 module to load. The scripts
      # drop it at <out>/runtimes/<rid>/native/pkcs11-mock.{so,dylib,dll}.
      - name: Build pkcs11-mock
        if: runner.os != 'Windows'
        run: ./build/build-pkcs11-mock.sh "$RUNNER_TEMP/mock"
      - name: Build pkcs11-mock (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build-pkcs11-mock.ps1 -TestOutputDir "$env:RUNNER_TEMP/mock" -Rid ${{ matrix.rid }}

      # Same sources, built as an archive so the publish below can link the module into the binary.
      - name: Build pkcs11-mock static archive
        if: runner.os != 'Windows'
        run: ./build/build-pkcs11-mock-static.sh "$RUNNER_TEMP/mock-static"

      - name: Publish AotSmoke (Native AOT)
        run: |
          static=()
          if [ "$RUNNER_OS" != "Windows" ]; then
            static=(-p:StaticMockArchive="$RUNNER_TEMP/mock-static/libpkcs11-mock.a")
          fi
          dotnet publish tests/AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} "${static[@]}"

      - name: Run AOT smoke against pkcs11-mock
        run: |
          set -euxo pipefail
          bin="tests/AotSmoke/bin/Release/net10.0/${{ matrix.rid }}/publish/AotSmoke"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          test -f "$bin"
          echo "AOTSMOKE_BIN=$PWD/$bin" >> "$GITHUB_ENV"

          # Dynamically loaded module.
          "$bin" "$RUNNER_TEMP/mock/runtimes/${{ matrix.rid }}/native/${{ matrix.mock }}"

      # A throwaway token with a per-run random PIN: no PIN is written down anywhere.
      - name: Run AOT smoke session flow against SoftHSM
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            lib="$(brew --prefix softhsm)/lib/softhsm/libsofthsm2.so"
          else
            lib=/usr/lib/softhsm/libsofthsm2.so
          fi
          dir="$RUNNER_TEMP/softhsm"
          mkdir -p "$dir/tokens"
          printf 'directories.tokendir = %s/tokens\nobjectstore.backend = file\n' "$dir" > "$dir/softhsm2.conf"
          export SOFTHSM2_CONF="$dir/softhsm2.conf"
          pin="$(openssl rand -hex 16)"
          echo "::add-mask::$pin"
          softhsm2-util --init-token --free --label aot-smoke --pin "$pin" --so-pin "$(openssl rand -hex 16)"
          PKCS11_SMOKE_TOKEN_LABEL=aot-smoke PKCS11_SMOKE_USER_PIN="$pin" "$AOTSMOKE_BIN" "$lib"

      - name: Run AOT smoke statically linked
        if: runner.os != 'Windows'
        run: |
          set -euxo pipefail
          # Assert the bootstrap is actually exported first, so a linker/exports-file regression fails
          # here saying so rather than as a bare "entry point not found" from the run. Mach-O prefixes
          # C symbols with an underscore and has no separate dynamic symbol table, hence the two
          # spellings.
          if [ "$RUNNER_OS" = "macOS" ]; then
            nm -gU "$AOTSMOKE_BIN" | grep -q ' T _C_GetFunctionList'
          else
            nm -D "$AOTSMOKE_BIN" | grep -q ' T C_GetFunctionList'
          fi
          "$AOTSMOKE_BIN" static

  # Real pre-v3.0 backends: modules that predate the v3.0 C_GetInterface API, so they exercise the
  # wrapper's v2.40 negotiation, single-part fallback and v2.40 struct layouts against genuine old
  # modules — the authentic counterpart of the synthetic gate-240 shim on the build-and-test legs.
  # Each is staged from pinned Debian snapshot binaries (neither builds against a modern toolchain),
  # so no submodules or vendored native builds are needed here.
  # - SoftHSM 2.5: reports Cryptoki 2.40.
  # - NSS 3.51: the last release before 3.52 added C_GetInterface. Reports Cryptoki 2.20 while
  #   implementing v2.40 mechanisms, and needs its parameter string in C_Initialize (the NSS fixture
  #   passes one). Unlike SoftHSM it implements CKM_PKCS5_PBKD2, so it covers the v2.40
  #   CK_PKCS5_PBKD2_PARAMS layout.
  pkcs11-v240:
    name: PKCS11 v2.40 (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: SoftHSM 2.5
            setup: build/setup-softhsm25.sh
            library-var: PKCS11_TEST_SOFTHSM_LIBRARY
            library: libsofthsm2.so
            expect-var: PKCS11_TEST_EXPECT_SOFTHSM_V240
            filter: /*/*/*SoftHsm*/*
          - backend: NSS 3.51
            setup: build/setup-nss351.sh
            library-var: PKCS11_TEST_NSS_LIBRARY
            library: libsoftokn3.so
            expect-var: PKCS11_TEST_EXPECT_NSS_V240
            filter: /*/*/*Nss*/*
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402' # exact SDK: the lock files record its ILLink and ILCompiler packages (see the library's .csproj)

      # Points the backend's fixture at the staged module, and arms its compliance tests, which fail
      # the leg if the module is not actually pre-v3.0.
      - name: Stage ${{ matrix.backend }}
        env:
          SETUP: ${{ matrix.setup }}
          LIBRARY_VAR: ${{ matrix.library-var }}
          LIBRARY: ${{ matrix.library }}
          EXPECT_VAR: ${{ matrix.expect-var }}
        run: |
          set -euo pipefail
          native="$(bash "$SETUP" "$RUNNER_TEMP/pkcs11-v240")"
          {
            echo "${LIBRARY_VAR}=${native}/${LIBRARY}"
            echo "LD_LIBRARY_PATH=${native}"
            echo "${EXPECT_VAR}=1"
          } >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore KerckhoffsLabs.sln --locked-mode

      # The staged module is used directly, and the ABI oracle feeds the unit tests, which this job
      # filters out (one backend's suite only), so skip every native build.
      - name: Build
        env:
          SkipNativeBuilds: true
        run: dotnet build KerckhoffsLabs.sln --no-restore -c Release

      # Run the backend's suite against the staged module. The mechanism-list and capability gates
      # skip anything it predates (EdDSA on SoftHSM 2.5; the hashed RSA-PSS mechanisms, DSA-SHA224
      # and the message API on NSS 3.51).
      - name: Test (${{ matrix.backend }})
        env:
          FILTER: ${{ matrix.filter }}
        run: dotnet test --solution KerckhoffsLabs.sln --no-build -c Release --output Detailed -- --filter-query "$FILTER"
