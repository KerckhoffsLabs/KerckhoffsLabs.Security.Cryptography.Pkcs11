name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Lint only verifies formatting; skip the native vendor builds so this job
      # needs neither the submodules nor a C toolchain.
      SkipPkcs11MockBuild: true
      SkipSoftHsmV2Build: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore src/KerckhoffsLabs.sln

      - run: dotnet format src/KerckhoffsLabs.sln --verify-no-changes --no-restore

  build-and-test:
    name: ${{ matrix.os }}${{ matrix.arch == 'x86' && ' (x86)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: windows-latest
            arch: x86

    steps:
      # submodules: the test project builds pkcs11-mock (vendor/pkcs11-mock) and,
      # on Linux/macOS, SoftHSM2 (vendor/softhsmv2) from source during `dotnet build`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
          architecture: ${{ matrix.arch || 'x64' }}

      # pkcs11-mock builds with gcc/make (in build-essential); SoftHSM2 builds with
      # CMake against the OpenSSL backend (libssl-dev). Both BeforeTargets fire during
      # the Build step below, placing the libraries next to the test assembly where the
      # backend fixtures auto-discover them.
      # Windows SoftHSM2 is gated off for now: the vendored build (build-softhsmv2.ps1) compiles,
      # but token init fails to load the module and a from-source vcpkg OpenSSL build takes ~27 min.
      # Tracked as a follow-up; until then Windows runs pkcs11-mock only and SoftHSM tests self-skip.
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev

      - name: Restore
        run: dotnet restore src/KerckhoffsLabs.sln

      - name: Build
        env:
          SkipSoftHsmV2Build: ${{ runner.os == 'Windows' && 'true' || '' }}
        run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release

      # Auditable record of which SoftHSM the Linux job will exercise. The vendored
      # BuildSoftHsmV2 target places libsofthsm2.so + softhsm2-util next to the test
      # assembly; if the build silently failed to place them, this surfaces it in the
      # log and the SoftHsm_IsAvailable_OnCiBuildPlatforms test fails the job.
      - name: Report SoftHSM build (Linux)
        if: runner.os == 'Linux'
        run: |
          util=$(find . -path '*runtimes*native*' -name 'softhsm2-util' | head -1)
          if [ -n "$util" ]; then echo "Built SoftHSM: $util"; "$util" --version; \
          else echo "::warning::built softhsm2-util not found under runtimes/*/native"; fi

      # Linux builds both backends (pkcs11-mock + SoftHSM2 via build-softhsmv2.sh), so the
      # SoftHSM-gated [ConditionalFact] tests run there and the SoftHsm_IsAvailable_OnCiBuildPlatforms
      # guard fails the job if the build failed to place libsofthsm2. Windows builds pkcs11-mock
      # only (SoftHSM2 gated off above), so its SoftHSM tests self-skip and the guard is a no-op.
      - name: Test
        run: dotnet test src/KerckhoffsLabs.sln --no-build -c Release --logger "console;verbosity=normal"
