name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install SoftHSM2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y softhsm2

      - name: Install SoftHSM2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y softhsm --no-progress
          if (-not (Get-Command softhsm2-util.exe -ErrorAction SilentlyContinue))
          {
              $candidate = (Get-ChildItem -Path 'C:\Program Files\SoftHSM2\bin\softhsm2-util.exe' -ErrorAction SilentlyContinue)
              if (-not $candidate) {
                  Write-Error "SoftHSM2 install did not produce softhsm2-util.exe"
                  exit 1
              }
              echo "$($candidate.DirectoryName)" >> $env:GITHUB_PATH
          }
          softhsm2-util.exe --version

      - name: Restore
        run: dotnet restore src/KerckhoffsLabs.sln

      - name: Build
        run: dotnet build src/KerckhoffsLabs.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/KerckhoffsLabs.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

  pack:
    name: pack
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Pack
        run: dotnet pack src/KerckhoffsLabs.Security.Cryptography.Pkcs11/KerckhoffsLabs.Security.Cryptography.Pkcs11.csproj --configuration Release -p:SkipPkcs11MockBuild=true -o artifacts

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/
