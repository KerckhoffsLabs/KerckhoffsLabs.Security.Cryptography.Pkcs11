name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Lint builds managed code only; skip the native vendor builds so this job
      # needs neither the submodules nor a C toolchain.
      SkipPkcs11MockBuild: true
      SkipSoftHsmV2Build: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore src/KerckhoffsLabs.sln

      # `dotnet format` loads source generators from the built analyzer assemblies, so the
      # solution must be built first — otherwise the generated `CK_*_Windows` types are absent
      # and format aborts with CS0246 before it can check formatting. The native vendor builds
      # are skipped (env above), so this compiles managed code only.
      - run: dotnet build src/KerckhoffsLabs.sln --no-restore

      - run: dotnet format src/KerckhoffsLabs.sln --verify-no-changes --no-restore

  build-and-test:
    name: ${{ matrix.os }}${{ matrix.arch == 'x86' && ' (x86)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-latest
          - os: windows-latest
          - os: windows-latest
            arch: x86
          - os: windows-11-arm
            arch: arm64

    steps:
      # submodules: the test project builds pkcs11-mock (vendor/pkcs11-mock) and,
      # on Linux (x64+arm64), macOS, and Windows (x64+x86+arm64), SoftHSM2 (vendor/softhsmv2)
      # from source during `dotnet build`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
          # macOS runners are Apple Silicon: use the native arm64 SDK. Forcing x64 there runs
          # dotnet under Rosetta, so the pkcs11-mock build script's `uname -m` reports x86_64
          # (places the lib under osx-x64) while the testhost resolves osx-arm64 — a mismatch that
          # makes every Mock-backend test fail to find pkcs11-mock.dylib.
          architecture: ${{ matrix.arch || (runner.os == 'macOS' && 'arm64' || 'x64') }}

      # pkcs11-mock builds with gcc/make (in build-essential) on Linux/macOS and MSVC on Windows.
      # SoftHSM2 builds from source during the Build step below (BeforeTargets), placing the
      # libraries next to the test assembly where the backend fixtures auto-discover them:
      #   - Linux:        autotools (autoconf/automake/libtool) against an OpenSSL 3.5 we build below.
      #   - macOS:        autotools against Homebrew OpenSSL 3 (native arm64).
      #   - Windows x64/x86/arm64: CMake + vcpkg OpenSSL (build-softhsmv2.ps1), each for its own triplet
      #     so the library matches the testhost arch. vcpkg OpenSSL is cached per-arch below.
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev autoconf automake libtool

      # SoftHSM is built against OpenSSL 3.5+ so ML-DSA (CKM_ML_DSA) compiles in — ubuntu-latest
      # ships OpenSSL 3.0, so we build 3.5.6 from source (the same release the upstream SoftHSM CI
      # uses) into a user-writable prefix (cache-friendly, no sudo). build-softhsmv2.sh reads
      # OPENSSL_PREFIX and bakes an rpath so libsofthsm2 loads this OpenSSL at runtime.
      - name: Cache OpenSSL 3.5
        if: runner.os == 'Linux'
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.6-${{ runner.arch }}
      - name: Build OpenSSL 3.5.6 (on cache miss)
        if: runner.os == 'Linux' && steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          work="$(mktemp -d)"; cd "$work"
          curl -fsSL --proto '=https' --proto-redir '=https' -O https://github.com/openssl/openssl/releases/download/openssl-3.5.6/openssl-3.5.6.tar.gz
          echo "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736  openssl-3.5.6.tar.gz" | sha256sum -c -
          tar -xf openssl-3.5.6.tar.gz && cd openssl-3.5.6
          ./config shared zlib no-ssl3 no-weak-ssl-ciphers --prefix="$HOME/openssl-3.5" --openssldir="$HOME/openssl-3.5"
          make -j"$(nproc)" >/dev/null
          make install_sw >/dev/null
          ( cd "$HOME/openssl-3.5" && ln -sf lib64 lib ) || true
      # OPENSSL_PREFIX: build-softhsmv2.sh links SoftHSM against this OpenSSL.
      # LD_LIBRARY_PATH: at runtime the .NET host loads the system libcrypto.so.3 (OpenSSL 3.0)
      # first, so the rpath in libsofthsm2 loses to the already-loaded soname and ML-DSA symbols
      # (OPENSSL_3.4.0+) are missing. Putting the 3.5 libdir on the loader path makes the whole
      # process use OpenSSL 3.5 (which .NET also supports), resolving the collision.
      - name: Point SoftHSM at OpenSSL 3.5 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "OPENSSL_PREFIX=$HOME/openssl-3.5" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib64:$HOME/openssl-3.5/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # macOS: SoftHSM builds with autotools against Homebrew OpenSSL 3. Unlike Linux, .NET on macOS
      # uses Apple's crypto (not system OpenSSL), so there is no in-process libcrypto collision — no
      # DYLD path needed. libsofthsm2.dylib records its libcrypto dependency by Homebrew's absolute
      # install path, which persists on the runner, so the copied-out dylib resolves it at runtime.
      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install autoconf automake libtool openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # build-softhsmv2.ps1 runs `vcpkg install openssl:<triplet>` during the Build step — a
      # from-source OpenSSL build (~27 min cold). vcpkg's default binary cache makes a warm restore
      # near-instant. Split restore/save: actions/cache's single-step post-save is skipped when the
      # job fails (and these runs fail at Test while we iterate on SoftHSM), so the archive would
      # never persist. The dedicated save step runs with if: always() — it saves the OpenSSL build
      # right after Build regardless of the later Test outcome. vcpkg keys archives by ABI hash
      # internally, so a coarse cache key is safe (a mismatch just rebuilds).
      - name: Restore vcpkg OpenSSL cache (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-openssl-${{ matrix.arch || 'x64' }}-windows-v1

      # Cache the *built* native libraries (pkcs11-mock + SoftHSM2 + its OpenSSL runtime DLLs) so the
      # whole native build — vcpkg install, CMake/autotools compile, link — is skipped on a hit. Keyed
      # on both vendored submodule SHAs and the build scripts, so a submodule bump or script change
      # rebuilds. On a hit we set SkipPkcs11MockBuild/SkipSoftHsmV2Build so the BeforeTargets don't run
      # and the restored artifacts are used as-is (the vcpkg/OpenSSL caches stay as the miss fallback).
      - name: Native build cache key
        id: native-key
        shell: bash
        run: echo "key=native-${{ runner.os }}-${{ matrix.arch || 'x64' }}-mock_$(git -C vendor/pkcs11-mock rev-parse HEAD)-hsm_$(git -C vendor/softhsmv2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache built native libraries
        id: native-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/KerckhoffsLabs.Security.Cryptography.Pkcs11.Tests/bin/Release/net10.0/runtimes
          key: ${{ steps.native-key.outputs.key }}-${{ hashFiles('build/build-softhsmv2.sh', 'build/build-softhsmv2.ps1', 'build/build-pkcs11-mock.sh', 'build/build-pkcs11-mock.ps1') }}-v1

      - name: Restore
        run: dotnet restore src/KerckhoffsLabs.sln

      - name: Build
        env:
          # On a native-cache hit the prebuilt pkcs11-mock + SoftHSM2 are already in place; skip both
          # native build scripts so the BeforeTargets don't recompile from the vendored submodules.
          SkipPkcs11MockBuild: ${{ steps.native-cache.outputs.cache-hit == 'true' && 'true' || '' }}
          SkipSoftHsmV2Build: ${{ steps.native-cache.outputs.cache-hit == 'true' && 'true' || '' }}
        run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release

      # Persist the vcpkg OpenSSL build right after it's produced, even if the Test step later fails
      # (if: always()). Only saves on a cache miss — an existing key can't be overwritten anyway. The
      # x64 and x86 legs build different OpenSSL triplets, so the cache key includes the arch.
      - name: Save vcpkg OpenSSL cache (Windows)
        if: always() && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-openssl-${{ matrix.arch || 'x64' }}-windows-v1

      # Auditable record of which SoftHSM the Linux job will exercise. The vendored
      # BuildSoftHsmV2 target places libsofthsm2.so + softhsm2-util next to the test
      # assembly; if the build silently failed to place them, this surfaces it in the
      # log and the SoftHsm_IsAvailable_OnCiBuildPlatforms test fails the job.
      - name: Report SoftHSM build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          util=$(find . -path '*runtimes*native*' -name 'softhsm2-util' | head -1)
          if [ -n "$util" ]; then echo "Built SoftHSM: $util"; "$util" --version; \
          else echo "::warning::built softhsm2-util not found under runtimes/*/native"; fi

      - name: Report SoftHSM build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $util = Get-ChildItem -Recurse -Path . -Filter softhsm2-util.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($util) {
            Write-Host "Built SoftHSM: $($util.FullName)"; & $util.FullName --version
            Write-Host "Native dir contents (libsofthsm2.dll + OpenSSL runtime must be present):"
            Get-ChildItem (Split-Path $util.FullName) | Select-Object Length, Name | Format-Table -AutoSize | Out-String | Write-Host
          }
          else { Write-Host "::warning::built softhsm2-util.exe not found under runtimes/*/native" }

      # All legs (Linux x64+arm64, macOS, Windows x64+x86+arm64) build both backends (pkcs11-mock +
      # SoftHSM2), so the SoftHSM-gated [ConditionalFact] tests run everywhere and the
      # SoftHsm_IsAvailable_OnCiBuildPlatforms guard fails the job if the build failed to place libsofthsm2.
      - name: Test
        run: dotnet test src/KerckhoffsLabs.sln --no-build -c Release --logger "console;verbosity=normal"

  # Second independent real backend: opencryptoki's software token, built from source from the
  # pinned vendor/opencryptoki submodule (v3.27.0) rather than the distro package, so the exact
  # opencryptoki version is reproducible and independent of what ubuntu-latest happens to ship.
  # Running the same operations against a module unrelated to SoftHSM catches a mis-encoding the
  # wrapper and SoftHSM happen to share. Only the OpenCryptoki-tagged tests run here; everything
  # else skips because no PKCS11_TEST_OPENCRYPTOKI_LIBRARY is set on the other legs.
  opencryptoki:
    name: opencryptoki (linux-x64)
    runs-on: ubuntu-latest
    env:
      # No vendor native builds needed: this job runs only the opencryptoki-backed tests.
      SkipPkcs11MockBuild: true
      SkipSoftHsmV2Build: true
    steps:
      # Only vendor/opencryptoki is needed here; pull just that submodule (not SoftHSM/mock).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out opencryptoki submodule
        run: git submodule update --init --depth 1 vendor/opencryptoki

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Build opencryptoki from source
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool flex bison libssl-dev libcap-dev libldap2-dev pkg-config
          # The pkcs11 group must exist before `make install` (it chgrp's the token store to it).
          sudo groupadd -f pkcs11
          ./build/build-opencryptoki.sh
          sudo ldconfig

      - name: Provision software token
        run: |
          set -euxo pipefail
          sudo usermod -a -G pkcs11 "$(id -un)"

          # Our minimal build installs only the software-token STDLL (libpkcs11_sw.so). The default
          # config declares five slots (TPM/ICA/CCA/SW/EP11); pkcsslotd then spins trying to load the
          # four STDLLs that don't exist and never creates its socket, so clients fail C_Initialize
          # with CKR_FUNCTION_FAILED. Replace it with a single soft-token slot.
          printf 'version opencryptoki-3.27\n\nslot 0\n{\n    stdll = libpkcs11_sw.so\n    tokversion = 3.12\n}\n' \
            | sudo tee /etc/opencryptoki/opencryptoki.conf >/dev/null
          echo "=== opencryptoki.conf ==="; cat /etc/opencryptoki/opencryptoki.conf
          echo "=== stdll ==="; ls -la /usr/local/lib/opencryptoki/stdll/ 2>/dev/null || true

          # The software token's object store must exist and be writable by the pkcs11 group, else the
          # soft-token STDLL fails to initialize and C_GetSlotList reports zero tokens.
          sudo mkdir -p /var/lib/opencryptoki/swtok/TOK_OBJ
          sudo chgrp -R pkcs11 /var/lib/opencryptoki || true
          sudo chmod -R g+rwx /var/lib/opencryptoki || true

          # Start pkcsslotd via the shipped systemd unit. systemd manages the (forking) daemon and,
          # crucially, captures its stderr to the journal — the daemon closes stderr after forking,
          # so a manual launch hides any startup error. Relax the unit's heavy sandboxing for CI
          # (it otherwise mounts /run read-only, blocking the daemon's socket).
          sudo cp /usr/local/lib/systemd/system/pkcsslotd.service /etc/systemd/system/pkcsslotd.service
          sudo mkdir -p /etc/systemd/system/pkcsslotd.service.d
          printf '[Service]\nProtectSystem=no\nProtectHome=no\nReadWritePaths=/run /var\n' \
            | sudo tee /etc/systemd/system/pkcsslotd.service.d/ci.conf >/dev/null
          sudo systemd-tmpfiles --create 2>/dev/null || true
          sudo systemctl daemon-reload
          sudo systemctl start pkcsslotd || true
          sleep 2
          sudo systemctl --no-pager -l status pkcsslotd || true
          echo "=== pkcsslotd journal ==="; sudo journalctl -u pkcsslotd --no-pager | tail -60 || true
          sudo ls -la /run/opencryptoki/ || true
          echo "=== pkcsconf -s ==="; sg pkcs11 -c "/usr/local/sbin/pkcsconf -s"
          echo "=== pkcsconf -t ==="; sg pkcs11 -c "/usr/local/sbin/pkcsconf -t"

          SLOT=0
          # opencryptoki's default (pre-init) SO PIN is 87654321.
          # pkcsconf -I prompts for: SO PIN, then a token label.
          sg pkcs11 -c "printf '87654321\nkl-octk\n' | /usr/local/sbin/pkcsconf -c $SLOT -I"
          # pkcsconf -u (init user PIN) prompts for: SO PIN, new user PIN, confirm user PIN.
          sg pkcs11 -c "printf '87654321\n12345678\n12345678\n' | /usr/local/sbin/pkcsconf -c $SLOT -u"
          sg pkcs11 -c "/usr/local/sbin/pkcsconf -t"
          echo "=== mechanisms (pkcsconf -m) ==="; sg pkcs11 -c "/usr/local/sbin/pkcsconf -m -c $SLOT" || true
          LIB="$(find /usr/local/lib -name libopencryptoki.so 2>/dev/null | head -1)"
          test -n "$LIB"
          {
            echo "PKCS11_TEST_OPENCRYPTOKI_LIBRARY=$LIB"
            echo "PKCS11_TEST_OPENCRYPTOKI_TOKEN=kl-octk"
          } >> "$GITHUB_ENV"

      - run: dotnet restore src/KerckhoffsLabs.sln

      # Run under the pkcs11 group (usermod above does not affect the current shell) so the test
      # host can read the token store; the PKCS11_TEST_OPENCRYPTOKI_* env vars are inherited.
      - name: Test (opencryptoki backend)
        run: sg pkcs11 -c "dotnet test src/KerckhoffsLabs.Security.Cryptography.Pkcs11.Tests/KerckhoffsLabs.Security.Cryptography.Pkcs11.Tests.csproj -c Debug --filter 'FullyQualifiedName~OpenCryptoki'"
