name: coverage

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      # submodules: pkcs11-mock (vendor/pkcs11-mock) and SoftHSM2 (vendor/softhsmv2)
      # are built from source during `dotnet build` so both backends are exercised.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      # pkcs11-mock: gcc/make (build-essential); SoftHSM2: autotools (autoconf/automake/libtool).
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev autoconf automake libtool

      # Build SoftHSM against OpenSSL 3.5+ so ML-DSA compiles in (ubuntu-latest ships 3.0). Same
      # release as upstream SoftHSM CI; user-writable prefix for caching; build-softhsmv2.sh reads
      # OPENSSL_PREFIX.
      - name: Cache OpenSSL 3.5
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.6-${{ runner.arch }}
      - name: Build OpenSSL 3.5.6 (on cache miss)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          work="$(mktemp -d)"; cd "$work"
          curl -fsSL -O https://github.com/openssl/openssl/releases/download/openssl-3.5.6/openssl-3.5.6.tar.gz
          echo "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736  openssl-3.5.6.tar.gz" | sha256sum -c -
          tar -xf openssl-3.5.6.tar.gz && cd openssl-3.5.6
          ./config shared zlib no-ssl3 no-weak-ssl-ciphers --prefix="$HOME/openssl-3.5" --openssldir="$HOME/openssl-3.5"
          make -j"$(nproc)" >/dev/null
          make install_sw >/dev/null
          ( cd "$HOME/openssl-3.5" && ln -sf lib64 lib ) || true
      - name: Point SoftHSM at OpenSSL 3.5
        run: echo "OPENSSL_PREFIX=$HOME/openssl-3.5" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore src/KerckhoffsLabs.sln

      - name: Build
        run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release

      # Both backends present on Linux → coverage spans the mock and SoftHSM2 paths.
      - name: Test with coverage
        run: >
          dotnet test src/KerckhoffsLabs.sln --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "console;verbosity=normal"

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
