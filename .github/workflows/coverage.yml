name: coverage

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      # submodules: pkcs11-mock (vendor/pkcs11-mock) and SoftHSM2 (vendor/softhsmv2)
      # are built from source during `dotnet build` so both backends are exercised.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      # pkcs11-mock: gcc/make (build-essential); SoftHSM2: CMake + OpenSSL (libssl-dev).
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev

      - name: Restore
        run: dotnet restore src/KerckhoffsLabs.sln --locked-mode

      - name: Build
        run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release

      # Both backends present on Linux → coverage spans the mock and SoftHSM2 paths.
      - name: Test with coverage
        run: >
          dotnet test src/KerckhoffsLabs.sln --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "console;verbosity=normal"

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
