name: code-quality

# CI-based SonarCloud analysis + Codecov coverage upload, sharing a single build and
# test pass. The SonarCloud half REPLACES SonarCloud's Automatic Analysis: disable it
# under Project > Administration > Analysis Method, or this scan is rejected (the two
# modes are mutually exclusive). Unlike Automatic Analysis, the SonarScanner for .NET
# sees the MSBuild graph and imports test coverage.
#
# Unlike a pure-managed project, the build/tests here need the native PKCS#11 backends
# present, so this job builds the pkcs11-mock, SoftHSM2, and Kryoptic submodules from source
# and links SoftHSM/Kryoptic against OpenSSL 3.5+ (for ML-DSA and Kryoptic's "pqc" feature).
# Without them the scan and upload would report near-empty coverage — Kryoptic in particular
# is opt-in and easy to leave un-built, silently reporting 0% coverage on any change to its
# own fixture/tests and failing Sonar's new-code coverage gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref on pull requests; always run every push to main
# (each commit needs its own coverage + Sonar new-code analysis).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The scanner reads the token from SONAR_TOKEN; pass it via the environment rather
    # than expanding the secret inside a run block, where it can leak (githubactions:S7636).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # submodules: pkcs11-mock (vendor/pkcs11-mock) and SoftHSM2 (vendor/softhsmv2)
      # are built from source during `dotnet build` so both backends are exercised.
      # fetch-depth 0: Sonar needs full history for new-code detection and blame.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The Sonar analysis engine is JVM-based; the .NET scanner shells out to it.
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # pkcs11-mock: gcc/make (build-essential); SoftHSM2: autotools (autoconf/automake/libtool).
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev autoconf automake libtool

      # OpenSSL 3.5 for SoftHSM's ML-DSA and Kryoptic's "pqc" feature; see the action.
      - name: OpenSSL 3.5
        uses: $/.github/actions/openssl35

      # Fourth real backend, so its coverage counts toward the Sonar/Codecov numbers too (a
      # KryopticBackendFixture-only line change previously showed as 0% covered new code and
      # failed the Sonar quality gate, since Kryoptic is opt-in and wasn't built here). Same
      # OpenSSL 3.5 as SoftHSM/opencryptoki above (ossl-sys locates it via pkg-config, which
      # build-kryoptic.sh points at OPENSSL_PREFIX, which the OpenSSL 3.5 step exports).
      - name: Kryoptic submodule revision
        id: kryopticrev
        run: echo "sha=$(git -C vendor/kryoptic rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Kryoptic build
        id: kryoptic-cache
        uses: actions/cache@v6.1.0
        with:
          path: vendor/kryoptic/target
          key: kryoptic-${{ runner.arch }}-${{ steps.kryopticrev.outputs.sha }}-${{ hashFiles('build/build-kryoptic.sh') }}-v1

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore KerckhoffsLabs.sln

      # sonar.sourceEncoding is explicit because the scanner otherwise assumes the runner's default
      # charset, which is not guaranteed to be UTF-8 and mis-decodes every source file containing a
      # non-ASCII character (the em dashes and arrows used throughout the doc comments). That is
      # reported as "problems with file encoding in the source code". The repository is UTF-8 by
      # construction — .editorconfig sets charset = utf-8 and the dotnet format gate enforces it — so
      # this only tells the scanner what the files already are.
      #
      # docs/images is excluded because the scanner indexes those binary assets and tries to decode
      # them as text; icon.png in particular reports "Invalid character encountered ... at line 1",
      # which raises the same project-level encoding warning even when every real source file is
      # clean. They carry no analyzable content, so indexing them buys nothing.
      #
      # tests/ is excluded under both keys because the scanner sorts it two ways: the Tests project
      # is detected as a test project, so its files are test sources filtered by
      # sonar.test.exclusions, while AotSmoke is an ordinary executable whose files are main
      # sources filtered by sonar.exclusions. Excluding only one key leaves the other half analyzed.
      #
      # reportsPaths has a wildcard segment in the filename itself (coverage.opencover.*.xml, not a
      # literal coverage.opencover.xml): coverlet.MTP (the xUnit v3/MTP-native coverage extension,
      # unlike the old VSTest-collector coverlet.collector) names its own output
      # coverage.opencover.<numeric-id>.xml. A literal-filename glob here silently matches nothing
      # -- the scanner logs a WARN and imports zero coverage, which still lets the analysis
      # "succeed" while every line reports uncovered and the new-code coverage gate fails. The
      # Codecov "files:" glob below needs the same treatment for coverage.cobertura.*.xml.
      #
      # githubactions:S7637 wants every third-party `uses:` pinned to a commit SHA inline. The
      # workflows are pinned by .github/workflows/actions.lock instead, which Actions enforces at
      # run time (transitive dependencies included); Sonar does not read the lockfile, so it
      # flags every tag ref. Ignored for workflow and action files only: the organization's
      # "Require lockfile" Actions policy blocks any workflow whose dependencies are not in the lockfile.
      - name: Begin analysis
        run: >
          dotnet sonarscanner begin
          /k:"KerckhoffsLabs_KerckhoffsLabs.Security.Cryptography.Pkcs11"
          /o:"kerckhoffslabs"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.sourceEncoding="UTF-8"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.*.xml"
          /d:sonar.coverage.exclusions="**/*.SecurityAnalyzers/**/*.cs,**/*.SourceGenerators/**/*.cs"
          /d:sonar.exclusions="vendor/**,docs/images/**,tests/**"
          /d:sonar.test.exclusions="tests/**"
          /d:sonar.issue.ignore.multicriteria="actionslock"
          /d:sonar.issue.ignore.multicriteria.actionslock.ruleKey="githubactions:S7637"
          /d:sonar.issue.ignore.multicriteria.actionslock.resourceKey=".github/**/*.yml"

      # -p:UseMicrosoftTestingPlatformRunner=true: only this (Linux-only) job needs the full MTP
      # entry point, for coverlet.MTP's extension hook to register at all -- see the test csproj
      # for why every other leg deliberately builds without it. BuildKryoptic=true opts the Tests
      # project's BeforeTargets into building the vendored Kryoptic submodule (opt-in, off by
      # default) as part of this same solution build.
      - name: Build
        env:
          BuildKryoptic: 'true'
        run: dotnet build KerckhoffsLabs.sln --no-restore -c Release -p:UseMicrosoftTestingPlatformRunner=true

      # Three backends present on Linux → coverage spans the mock, SoftHSM2, and Kryoptic paths. A
      # single pass emits BOTH coverage formats — OpenCover (Sonar's first-class .NET format,
      # imported by the begin-step glob) and Cobertura (uploaded to Codecov below) — so the suite
      # is built and run once instead of duplicated across a separate workflow. Only the wide
      # (nuint) NativeCULong layout exists on Linux; the narrow (Windows uint) build is resolved
      # per-RID and can't be selected here. PKCS11_TEST_EXPECT_KRYOPTIC=1 makes
      # KryopticAvailabilityTests fail loudly if the build above silently didn't produce a working
      # library, instead of quietly recreating the 0%-new-code-coverage gap this step exists to close.
      - name: Test with coverage
        env:
          PKCS11_TEST_EXPECT_KRYOPTIC: '1'
        run: >
          dotnet test --solution KerckhoffsLabs.sln --no-build -c Release
          --results-directory ./coverage --output Detailed
          -- --coverlet --coverlet-output-format opencover --coverlet-output-format cobertura

      # Upload the Cobertura reports to Codecov. Push-only to preserve the previous coverage
      # workflow's trigger (and to avoid touching fork PRs, where the token is unavailable).
      # Runs before End analysis so a Codecov hiccup is independent of the Sonar import.
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage/**/coverage.cobertura.*.xml
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: End analysis
        run: dotnet sonarscanner end
