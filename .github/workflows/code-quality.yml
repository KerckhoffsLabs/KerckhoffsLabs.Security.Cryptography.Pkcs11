name: code-quality

# CI-based SonarCloud analysis + Codecov coverage upload, sharing a single build and
# test pass. The SonarCloud half REPLACES SonarCloud's Automatic Analysis: disable it
# under Project > Administration > Analysis Method, or this scan is rejected (the two
# modes are mutually exclusive). Unlike Automatic Analysis, the SonarScanner for .NET
# sees the MSBuild graph and imports test coverage.
#
# Unlike a pure-managed project, the build/tests here need the native PKCS#11 backends
# present, so this job builds the pkcs11-mock and SoftHSM2 submodules from source and
# links SoftHSM against OpenSSL 3.5+ (for ML-DSA). Without them the scan and upload
# would report near-empty coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref on pull requests; always run every push to main
# (each commit needs its own coverage + Sonar new-code analysis).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The scanner reads the token from SONAR_TOKEN; pass it via the environment rather
    # than expanding the secret inside a run block, where it can leak (githubactions:S7636).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # submodules: pkcs11-mock (vendor/pkcs11-mock) and SoftHSM2 (vendor/softhsmv2)
      # are built from source during `dotnet build` so both backends are exercised.
      # fetch-depth 0: Sonar needs full history for new-code detection and blame.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      # The Sonar analysis engine is JVM-based; the .NET scanner shells out to it.
      - name: Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '21'

      # pkcs11-mock: gcc/make (build-essential); SoftHSM2: autotools (autoconf/automake/libtool).
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev autoconf automake libtool

      # Build SoftHSM against OpenSSL 3.5+ so ML-DSA compiles in (ubuntu-latest ships 3.0). Same
      # release as upstream SoftHSM CI; user-writable prefix for caching; build-softhsmv2.sh reads
      # OPENSSL_PREFIX.
      - name: Cache OpenSSL 3.5
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.6-${{ runner.arch }}
      - name: Build OpenSSL 3.5.6 (on cache miss)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          work="$(mktemp -d)"; cd "$work"
          curl -fsSL --proto '=https' --proto-redir '=https' -O https://github.com/openssl/openssl/releases/download/openssl-3.5.6/openssl-3.5.6.tar.gz
          echo "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736  openssl-3.5.6.tar.gz" | sha256sum -c -
          tar -xf openssl-3.5.6.tar.gz && cd openssl-3.5.6
          ./config shared zlib no-ssl3 no-weak-ssl-ciphers --prefix="$HOME/openssl-3.5" --openssldir="$HOME/openssl-3.5"
          make -j"$(nproc)" >/dev/null
          make install_sw >/dev/null
          ( cd "$HOME/openssl-3.5" && ln -sf lib64 lib ) || true
      # LD_LIBRARY_PATH: ensure the whole process uses OpenSSL 3.5 (the .NET host otherwise loads
      # system libcrypto 3.0 first, so libsofthsm2's rpath loses and ML-DSA symbols are missing).
      - name: Point SoftHSM at OpenSSL 3.5
        run: |
          echo "OPENSSL_PREFIX=$HOME/openssl-3.5" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/openssl-3.5/lib64:$HOME/openssl-3.5/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore src/KerckhoffsLabs.sln

      - name: Begin analysis
        run: >
          dotnet sonarscanner begin
          /k:"KerckhoffsLabs_KerckhoffsLabs.Security.Cryptography.Pkcs11"
          /o:"kerckhoffslabs"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/*.Generators/**/*.cs"
          /d:sonar.exclusions="vendor/**"

      - name: Build
        run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release

      # Both backends present on Linux → coverage spans the mock and SoftHSM2 paths. A single
      # pass emits BOTH coverage formats — OpenCover (Sonar's first-class .NET format, imported
      # by the begin-step glob) and Cobertura (uploaded to Codecov below) — so the suite is built
      # and run once instead of duplicated across a separate workflow. Only the wide (nuint)
      # NativeCULong layout exists on Linux; the narrow (Windows uint) build is resolved per-RID
      # and can't be selected here.
      - name: Test with coverage
        run: >
          dotnet test src/KerckhoffsLabs.sln --no-build -c Release
          --collect:"XPlat Code Coverage;Format=opencover,cobertura"
          --results-directory ./coverage
          --logger "console;verbosity=normal"

      # Upload the Cobertura reports to Codecov. Push-only to preserve the previous coverage
      # workflow's trigger (and to avoid touching fork PRs, where the token is unavailable).
      # Runs before End analysis so a Codecov hiccup is independent of the Sonar import.
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: End analysis
        run: dotnet sonarscanner end
